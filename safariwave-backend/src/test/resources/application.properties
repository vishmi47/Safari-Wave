# Test configuration: replaces src/main/resources/application.properties when tests run.
# Uses an in-memory H2 database (MySQL mode) so tests need no MySQL server or password.
spring.datasource.url=jdbc:h2:mem:safariwave;MODE=MySQL;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-secret-that-is-long-enough-for-hs256-signing-123456
jwt.expiration=3600000

safariwave.booking.cutoff-hours=24
