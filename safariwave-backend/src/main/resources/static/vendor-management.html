<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SafariWave - Partner Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background-color: #f4f7f6; } .card { border-radius: 12px; border: none; } </style>
</head>
<body>
<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4 text-primary fw-bold"> Partner & Vendor Management</h2>

    <div class="row g-4">
        <!-- 1. VENDOR REGISTRATION FORM -->
        <div class="col-md-6">
            <div class="card shadow-sm p-4 h-100">
                <h4 class="mb-3">New Partner Registration</h4>
                <form id="vendorForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Business Name *</label>
                        <input type="text" class="form-control" id="businessName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Category *</label>
                        <select class="form-select" id="category" required>
                            <option value="">Select Category</option>
                            <option value="Hotel">Hotel / Accommodation</option>
                            <option value="Transport">Transport Service</option>
                            <option value="Restaurant">Restaurant / Catering</option>
                            <option value="Equipment">Equipment Supplier</option>
                            <option value="Travel Agency">Travel Agency</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Contact Person *</label>
                            <input type="text" class="form-control" id="contactPerson" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Phone *</label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email *</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Address</label>
                        <textarea class="form-control" id="address" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register Partner</button>
                </form>
                <div id="regMsg" class="mt-3 text-center fw-bold small"></div>
            </div>
        </div>

        <!-- 2. ADMIN DASHBOARD (GM VIEW) -->
        <div class="col-md-6">
            <div class="card shadow-sm p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Pending Approvals</h4>
                    <button onclick="loadPending()" class="btn btn-outline-secondary btn-sm">↻ Refresh</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr><th>Business</th><th>Email</th><th>Action</th></tr>
                        </thead>
                        <tbody id="pendingTable">
                        <tr><td colspan="3" class="text-center text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

                <h5 class="mt-4 mb-3">All Partners Status</h5>
                <div class="table-responsive" style="max-height: 200px;">
                    <table class="table table-sm">
                        <thead><tr><th>Name</th><th>Status</th></tr></thead>
                        <tbody id="allTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = '/api/vendors'; // Relative path works perfectly with Spring Boot static resources

    // Handle Registration
    document.getElementById('vendorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            businessName: document.getElementById('businessName').value,
            category: document.getElementById('category').value,
            contactPerson: document.getElementById('contactPerson').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value
        };

        try {
            const res = await fetch(`${API}/register`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
            });
            if(res.ok) {
                document.getElementById('regMsg').className = 'mt-3 text-center fw-bold small text-success';
                document.getElementById('regMsg').innerText = '✅ Registered Successfully! Status: PENDING';
                e.target.reset(); loadPending();
            } else {
                const err = await res.text();
                document.getElementById('regMsg').className = 'mt-3 text-center fw-bold small text-danger';
                document.getElementById('regMsg').innerText = '❌ ' + err;
            }
        } catch(e) {
            document.getElementById('regMsg').innerText = '⚠️ Server Error. Is backend running?';
        }
    });

    // Load Pending Vendors
    async function loadPending() {
        try {
            const res = await fetch(`${API}/pending`);
            const vendors = await res.json();
            const tbody = document.getElementById('pendingTable');

            if(vendors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">No pending approvals</td></tr>';
                return;
            }

            tbody.innerHTML = vendors.map(v => `
                <tr>
                    <td class="fw-bold">${v.businessName}<br><small class="text-muted">${v.category}</small></td>
                    <td>${v.email}</td>
                    <td>
                        <button onclick="updateStatus(${v.id}, 'approve')" class="btn btn-sm btn-success me-1" title="Approve">✓</button>
                        <button onclick="updateStatus(${v.id}, 'reject')" class="btn btn-sm btn-danger" title="Reject">✗</button>
                    </td>
                </tr>`).join('');
        } catch(e) { console.error(e); }
    }

    // Load All Vendors Summary
    async function loadAll() {
        try {
            const res = await fetch(API);
            const vendors = await res.json();
            document.getElementById('allTable').innerHTML = vendors.map(v => {
                let badge = v.status === 'APPROVED' ? 'bg-success' :
                    v.status === 'REJECTED' ? 'bg-danger' :
                        v.status === 'DEACTIVATED' ? 'bg-secondary' : 'bg-warning text-dark';
                return `<tr><td>${v.businessName}</td><td><span class="badge ${badge}">${v.status}</span></td></tr>`;
            }).join('');
        } catch(e) {}
    }

    // Update Status
    async function updateStatus(id, action) {
        if(!confirm(`Are you sure you want to ${action} this vendor?`)) return;
        await fetch(`${API}/${id}/${action}`, {method: 'PUT'});
        loadPending(); loadAll();
    }

    // Initial Load
    loadPending(); loadAll();
</script>
</body>
</html>
