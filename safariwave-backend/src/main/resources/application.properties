spring.application.name=safariwave-backend

spring.datasource.url=jdbc:mysql://localhost:3306/safariwave_db
# Set DB_USERNAME and DB_PASSWORD in the IDE run configuration or shell before starting the app (see README.md).
spring.datasource.username=root
spring.datasource.password=Vishmi@2147
# Local-only fallback: uncomment on your own machine instead of setting DB_PASSWORD. Never commit a real password.
# spring.datasource.password=${DB_PASSWORD:your-local-password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Customers can change or cancel a booking until this many hours before the trip starts
safariwave.booking.cutoff-hours=24

# Automatically complete scheduled or in-progress trips after their end time
safariwave.trips.completion-check-ms=60000
